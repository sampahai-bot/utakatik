name: pdf_office_converter
description: Konversi PDF ke DOCX, gambar, dan kompres - offline.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  open_filex: ^4.5.0
  pdf: ^3.11.1
  printing: ^5.13.4
  archive: ^3.6.1
  image: '>=4.2.0 <4.5.0'
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  image_path: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
